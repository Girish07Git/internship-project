<!DOCTYPE html>
<html>
<head>
<title>Student Login System</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Segoe UI', Arial, sans-serif;
        margin: 0;
        padding: 20px;
        position: relative;
    }
    
    /* Bottom background - dark blue color */
    body::after {
        content: '';
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 25%;
        background-color: #1e293b;
        z-index: -1;
        border-top-left-radius: 40px;
        border-top-right-radius: 40px;
    }
    
    .login-card {
        background: white;
        border-radius: 24px;
        padding: 35px 30px;
        width: 100%;
        max-width: 380px;
        box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    }
    
    h2 {
        text-align: center;
        color: #1e293b;
        font-size: 26px;
        margin-bottom: 8px;
    }
    
    .welcome {
        text-align: center;
        color: #64748b;
        font-size: 13px;
        margin-bottom: 30px;
    }
    
    label {
        font-weight: 600;
        color: #334155;
        margin-bottom: 6px;
        display: block;
        font-size: 13px;
    }
    
    input {
        width: 100%;
        padding: 10px 12px;
        border: 1.5px solid #e2e8f0;
        border-radius: 12px;
        font-size: 14px;
        margin-bottom: 18px;
        transition: 0.2s;
    }
    
    input:focus {
        border-color: #667eea;
        outline: none;
        box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
    }
    
    button {
        width: 100%;
        padding: 11px;
        background: #667eea;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: 0.2s;
    }
    
    button:hover {
        background: #5a67d8;
        transform: scale(0.98);
    }
    
    .footer-links {
        text-align: center;
        margin-top: 20px;
        font-size: 12px;
    }
    
    .footer-links a {
        color: #667eea;
        text-decoration: none;
        margin: 0 8px;
    }
    
    .footer-links a:hover {
        text-decoration: underline;
    }
    
    hr {
        margin: 20px 0 10px;
        border-color: #e2e8f0;
    }
</style>
</head>
<body>

<div class="login-card">
    <h2>Login</h2>
    <div class="welcome">Welcome back! 👋</div>
    
    <form method="POST">
        <label>📧 Email</label>
        <input type="email" name="email" placeholder="student@example.com" required>
        
        <label>🔒 Password</label>
        <input type="password" name="password" placeholder="••••••••" required>
        
        <button type="submit">Login →</button>
        
        <hr>
        <div class="footer-links">

    <a href="/forgot-password">
    Forgot password?
</a>
    <span>|</span>

    <a href="/register">
        Create account
    </a>

</div>
</body>
</html>
