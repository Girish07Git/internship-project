<!DOCTYPE html>
<html>
<head>
    <title>AI Budget System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height: 100vh;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        
        /* Simple Navbar */
        .navbar {
            background: rgba(255,255,255,0.15);
            padding: 15px 30px;
            backdrop-filter: blur(10px);
        }
        
        .navbar-brand {
            color: white;
            font-size: 24px;
            font-weight: bold;
        }
        
        .navbar-brand i {
            margin-right: 8px;
        }
        
        .btn-login {
            background: white;
            color: #667eea;
            border: none;
            padding: 8px 25px;
            border-radius: 50px;
            font-weight: bold;
            text-decoration: none;
            margin-right: 10px;
        }
        
        .btn-login:hover {
            background: #f0f0f0;
        }
        
        .btn-signup {
            background: #fbbf24;
            color: #333;
            border: none;
            padding: 8px 25px;
            border-radius: 50px;
            font-weight: bold;
            text-decoration: none;
        }
        
        .btn-signup:hover {
            background: #f59e0b;
        }
        
        /* Hero Section */
        .hero {
            text-align: center;
            padding: 60px 20px;
            animation: fadeIn 0.8s ease;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .hero h1 {
            color: white;
            font-size: 48px;
            font-weight: 800;
            margin-bottom: 15px;
        }
        
        .hero p {
            color: rgba(255,255,255,0.9);
            font-size: 18px;
            margin-bottom: 30px;
        }
        
        .hero img {
            width: 500px;
            max-width: 90%;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
            margin: 20px 0;
            border: 3px solid rgba(255,255,255,0.3);
        }
        
        .hero h4 {
            color: #fbbf24;
            margin-top: 20px;
            font-size: 22px;
        }
        
        /* Features Box */
        .features {
            background: rgba(255,255,255,0.1);
            border-radius: 30px;
            padding: 40px;
            margin: 30px auto;
            max-width: 1000px;
        }
        
        .features h3 {
            color: white;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .feature-box {
            background: rgba(255,255,255,0.15);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
            transition: 0.3s;
        }
        
        .feature-box:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.25);
        }
        
        .feature-box i {
            font-size: 40px;
            color: #fbbf24;
            margin-bottom: 10px;
        }
        
        .feature-box h5 {
            color: white;
            font-weight: bold;
        }
        
        .feature-box p {
            color: rgba(255,255,255,0.85);
            font-size: 14px;
        }
        
        /* Simple CTA */
        .cta {
            text-align: center;
            background: rgba(255,255,255,0.1);
            border-radius: 50px;
            padding: 30px;
            margin: 30px auto;
            max-width: 600px;
        }
        
        .cta h3 {
            color: white;
        }
        
        .cta p {
            color: rgba(255,255,255,0.9);
            margin-bottom: 20px;
        }
        
        .btn-get {
            background: #fbbf24;
            color: #333;
            padding: 12px 30px;
            border-radius: 50px;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
        }
        
        .btn-get:hover {
            background: #f59e0b;
        }
        
        /* Footer */
        .footer {
            text-align: center;
            padding: 20px;
            color: rgba(255,255,255,0.7);
            font-size: 12px;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin-top: 40px;
        }
        
        @media (max-width: 768px) {
            .hero h1 {
                font-size: 32px;
            }
            .features {
                padding: 20px;
            }
        }
    </style>
</head>
<body>

<!-- Simple Navbar -->
<div class="navbar">
    <div class="container">
        <div class="row w-100 align-items-center">
            <div class="col-6">
                <span class="navbar-brand">
                    <i class="fas fa-robot"></i> AI Budget
                </span>
            </div>
            <div class="col-6 text-end">
                <a href="/login" class="btn-login">Login</a>
                <a href="/register" class="btn-signup">Sign Up</a>
            </div>
        </div>
    </div>
</div>

<!-- Main Hero -->
<div class="hero">
    <h1>AI Budget Recommendation System</h1>
    <p>Smart way to manage your money</p>
    <img src="https://images.unsplash.com/photo-1554224155-6726b3ff858f?w=800&h=450&fit=crop" alt="Budget Planning">
    <h4><i class="fas fa-chart-line"></i> Smart Budget Planning & Expense Management</h4>
</div>


<!-- Call to Action -->
<div class="container">
    <div class="cta">
        <h3>Ready to start saving?</h3>
        <p>Join thousands of users using AI Budget</p>
        <a href="/register" class="btn-get">Get Started Free →</a>
    </div>
</div>

<!-- Footer -->
<div class="footer">
    <p>© 2024 AI Budget | Smart Budget Planning & Expense Management</p>
</div>

</body>
</html>
